<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Table Poker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="setup-screen" class="setup-card" aria-labelledby="page-title">
        <p class="eyebrow">Poker night</p>
        <h1 id="page-title">Set up the table</h1>

        <form id="setup-form">
          <label for="player-count">Number of players</label>
          <select id="player-count" name="playerCount">
            <option value="2" selected>2 players</option>
            <option value="3">3 players</option>
            <option value="4">4 players</option>
            <option value="5">5 players</option>
            <option value="6">6 players</option>
            <option value="7">7 players</option>
            <option value="8">8 players</option>
          </select>
          <div class="money-grid">
            <div>
              <label for="starting-money">Starting money</label>
              <input id="starting-money" name="startingMoney" type="number" min="1" value="250" inputmode="numeric" required />
            </div>
            <div>
              <label for="ante">Ante</label>
              <input id="ante" name="ante" type="number" min="0" value="5" inputmode="numeric" required />
            </div>
            <div class="ante-increase-field">
              <label for="ante-increase">Ante increase</label>
              <input id="ante-increase" name="anteIncrease" type="number" min="0" value="5" inputmode="numeric" required />
            </div>
          </div>

          <div class="players-heading">
            <label>Player names <span>(optional)</span></label>
            <p>Add them now, or leave them blank and fill them in later.</p>
          </div>
          <div id="player-names" class="player-names"></div>

          <label for="dealer">Who is dealer?</label>
          <select id="dealer" name="dealer"></select>

          <button id="test-voice-button" class="test-voice-button" type="button">Test voice</button>
          <button type="submit">Start game</button>
          <p id="message" class="message" role="status"></p>
        </form>
      </section>

      <section id="game-screen" class="game-screen" aria-label="Poker game" hidden>
        <div id="player-seats" class="player-seats" aria-label="Players around the table"></div>
        <button id="recording-button" class="recording-button" type="button" aria-pressed="false">Start recording</button>
        <p id="voice-status" class="voice-status" aria-live="polite" hidden></p>
        <p id="voice-transcript" class="voice-transcript" aria-live="polite" hidden></p>
        <div id="turn-indicator" class="turn-indicator" aria-live="polite">
          <p id="round-label" class="round-label">Preflop</p>
          <div class="bet-control">
            <button id="bet-increase" type="button" aria-label="Increase bet">+</button>
            <input id="current-bet" type="number" inputmode="numeric" aria-label="Chips to add to your bet" />
            <button id="bet-decrease" type="button" aria-label="Decrease bet">−</button>
          </div>
          <div id="pot-display" class="pot-display">
            <output id="pot-value" class="pot-value" aria-label="Pot">0</output>
            <output id="side-pot-value" class="side-pot-value" aria-label="Side pot" hidden>0</output>
          </div>
          <div class="action-buttons">
            <button id="undo-button" type="button" hidden>Undo last turn</button>
            <button id="confirm-button" type="button">Confirm bet</button>
            <button id="fold-button" type="button">Fold</button>
          </div>
        </div>
        <section id="winner-picker" class="winner-picker" aria-live="polite" hidden>
          <p id="winner-question">Who had the best cards?</p>
          <div id="winner-options" class="winner-options"></div>
        </section>
        <section id="deal-prompt" class="winner-picker" aria-live="polite" hidden>
          <p id="deal-message"></p>
          <button id="deal-ok-button" type="button">OK</button>
        </section>
      </section>
      <section id="game-winner-screen" class="game-winner-screen" aria-live="polite" hidden>
        <img src="assets/fireworks.webp" alt="Fireworks" />
        <h1 id="game-winner-message"></h1>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
