<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Table Poker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="setup-screen" class="setup-card" aria-labelledby="page-title">
        <p class="eyebrow">Poker night</p>
        <h1 id="page-title">Set up the table</h1>

        <form id="setup-form">
          <label for="player-count">Number of players</label>
          <select id="player-count" name="playerCount">
            <option value="2">2 players</option>
            <option value="3">3 players</option>
            <option value="4" selected>4 players</option>
            <option value="5">5 players</option>
            <option value="6">6 players</option>
            <option value="7">7 players</option>
            <option value="8">8 players</option>
          </select>
          <div class="money-grid">
            <div>
              <label for="starting-money">Starting money</label>
              <input id="starting-money" name="startingMoney" type="number" min="1" value="100" inputmode="numeric" required />
            </div>
            <div>
              <label for="ante">Ante</label>
              <input id="ante" name="ante" type="number" min="0" value="5" inputmode="numeric" required />
            </div>
          </div>

          <div class="players-heading">
            <label>Player names <span>(optional)</span></label>
            <p>Add them now, or leave them blank and fill them in later.</p>
          </div>
          <div id="player-names" class="player-names"></div>

          <label for="dealer">Who is dealer?</label>
          <select id="dealer" name="dealer"></select>

          <button type="submit">Start game</button>
          <p id="message" class="message" role="status"></p>
        </form>
      </section>

      <section id="game-screen" class="game-screen" aria-label="Poker game" hidden>
        <div id="player-seats" class="player-seats" aria-label="Players around the table"></div>
        <div id="turn-indicator" class="turn-indicator" aria-live="polite">
          <div class="bet-control">
            <button id="bet-increase" type="button" aria-label="Increase bet">+</button>
            <input id="current-bet" type="number" inputmode="numeric" aria-label="Your bet" />
            <button id="bet-decrease" type="button" aria-label="Decrease bet">−</button>
          </div>
          <output id="pot-value" class="pot-value" aria-label="Pot">0</output>
        </div>
        <div class="action-buttons">
          <button id="fold-button" type="button">Fold</button>
          <button id="confirm-button" type="button">Confirm bet</button>
        </div>
        <section id="winner-picker" class="winner-picker" aria-live="polite" hidden>
          <p id="winner-question">Who had the best cards?</p>
          <div id="winner-options" class="winner-options"></div>
        </section>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
